# ─────────────────────────────────────────────────────────────────────────────
# Pocket Finance Genius — Nginx com HTTPS (Let's Encrypt / Certbot)
#
# Pré-requisitos para ativar HTTPS:
#   1. Apontar seu domínio para o IP do servidor (registro DNS tipo A)
#   2. sudo apt install certbot python3-certbot-nginx
#   3. sudo certbot --nginx -d seudominio.com.br
#      (O certbot preencherá os caminhos dos certificados automaticamente)
#
# Se ainda não tiver domínio, use o bloco HTTP temporário mais abaixo.
# ─────────────────────────────────────────────────────────────────────────────

# ── Redireciona HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Necessário para renovação automática do Certbot (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todo o resto para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor HTTPS principal ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seudominio.com.br www.seudominio.com.br;

    # ── Certificados TLS (preenchidos pelo certbot) ──
    ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers de segurança ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Frontend — arquivos estáticos gerados pelo "vite build" ─────────────
    root  /var/www/pocket-finance-genius/dist;
    index index.html;

    # SPA: qualquer rota que não seja arquivo cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy reverso para a API Express (porta 3001) ─────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
